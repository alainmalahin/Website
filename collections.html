<body>

<nav class="page-menu">
  <a href="index.html" id="home-link">INICIO</a>
  <a href="story.html" id="history-link">HISTORIA</a>
</nav>

<div class="language-switcher">
  <button type="button" id="lang-es">ES</button>
  <span>/</span>
  <button type="button" id="lang-en">EN</button>
</div>

<main>

<section class="collection-hero">

<div class="hero-content">

<p class="hero-small">ERA I</p>

<h1 id="collection-title">ORÍGENES</h1>

<p class="hero-text" id="collection-text">

LA PRIMERA COLECCIÓN

<br>

PRÓXIMAMENTE

</p>
<div class="newsletter">

  <p
  id="newsletter-text"
  data-es="SÉ EL PRIMERO EN DESCUBRIR ORÍGENES."
  data-en="BE THE FIRST TO DISCOVER ORIGINS.">
  SÉ EL PRIMERO EN DESCUBRIR ORÍGENES.
</p>

  <form
  class="newsletter-form"
  action="https://formspree.io/f/mdaqkwpk"
  method="POST">

    <input
  type="email"
  name="email"
  placeholder="TU CORREO ELECTRÓNICO"
  data-placeholder-es="TU CORREO ELECTRÓNICO"
  data-placeholder-en="YOUR EMAIL ADDRESS"
  required>

    <button
  type="submit"
  data-es="SUSCRIBIRME"
  data-en="SUBSCRIBE">
  SUSCRIBIRME
</button>

  </form>
<p
  id="newsletter-success"
  style="display:none;"
  data-es="GRACIAS. YA FORMAS PARTE DE ORÍGENES."
  data-en="THANK YOU. YOU ARE NOW PART OF ORIGINS.">
  GRACIAS. YA FORMAS PARTE DE ORÍGENES.
</p>
</div>
</div>

</section>

</main>

<script>

document.addEventListener("DOMContentLoaded", function(){

const langEs = document.getElementById("lang-es");
const langEn = document.getElementById("lang-en");

const homeLink = document.getElementById("home-link");
const historyLink = document.getElementById("history-link");

const collectionTitle = document.getElementById("collection-title");
const collectionText = document.getElementById("collection-text");

function setLanguage(language){

if(language === "en"){

document.documentElement.lang = "en";

homeLink.textContent = "HOME";

historyLink.textContent = "HISTORY";

collectionTitle.textContent = "ORIGINS";

collectionText.innerHTML =
"THE FIRST COLLECTION<br>COMING SOON";

langEs.classList.remove("active");

langEn.classList.add("active");

localStorage.setItem("alainLanguage", "en");

}else{

document.documentElement.lang = "es";

homeLink.textContent = "INICIO";

historyLink.textContent = "HISTORIA";

collectionTitle.textContent = "ORÍGENES";

collectionText.innerHTML =
"LA PRIMERA COLECCIÓN<br>PRÓXIMAMENTE";

langEn.classList.remove("active");

langEs.classList.add("active");

localStorage.setItem("alainLanguage", "es");

}
const newsletterEmail = document.querySelector(
  '.newsletter-form input[type="email"]'
);

const newsletterButton = document.querySelector(
  '.newsletter-form button'
);

const newsletterText = document.getElementById("newsletter-text");

if (newsletterEmail) {
  newsletterEmail.placeholder =
    language === "es"
      ? "TU CORREO ELECTRÓNICO"
      : "YOUR EMAIL ADDRESS";
}

if (newsletterButton) {
  newsletterButton.textContent =
    language === "es"
      ? "SUSCRIBIRME"
      : "SUBSCRIBE";
}

if (newsletterText) {
  newsletterText.textContent =
    language === "es"
      ? "SÉ EL PRIMERO EN DESCUBRIR ORÍGENES."
      : "BE THE FIRST TO DISCOVER ORIGINS.";
}
}

langEs.addEventListener("click", function(){

setLanguage("es");

});

langEn.addEventListener("click", function(){

setLanguage("en");

});

const savedLanguage =
localStorage.getItem("alainLanguage") || "es";

setLanguage(savedLanguage);

});

</script>
<script>
const newsletterForm = document.querySelector(".newsletter-form");
const newsletterSuccess = document.getElementById("newsletter-success");

newsletterForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const response = await fetch(newsletterForm.action, {
    method: "POST",
    body: new FormData(newsletterForm),
    headers: {
      "Accept": "application/json"
    }
  });

  if (response.ok) {
    newsletterForm.style.display = "none";
    document.getElementById("newsletter-text").style.display = "none";
    newsletterSuccess.style.display = "block";
  }
});
</script>
