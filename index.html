<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALAIN MALAHIN</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
font-family:Georgia,serif;
overflow:hidden;
background:#000;
}

.hero{
width:100%;
height:100vh;
background:url("images/hero.webp") center center;
background-size:cover;
background-repeat:no-repeat;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.45);
}

.content{
position:relative;
z-index:2;
text-align:center;
padding:20px;
}

.logo{
width:140px;
margin-bottom:30px;
}

h1{
font-size:clamp(50px,10vw,90px);
color:white;
letter-spacing:6px;
line-height:.95;
margin-bottom:20px;
}

.gold{
color:#D4AF37;
font-size:22px;
margin-bottom:15px;
}

.sub{
font-size:28px;
margin-bottom:40px;
color:white;
}

a{
display:inline-block;
padding:18px 60px;
border:1px solid #D4AF37;
color:white;
text-decoration:none;
letter-spacing:4px;
transition:.3s;
}

a:hover{
background:#D4AF37;
color:black;
}
</style>
</head>

<body>

<section class="hero">

<div class="content">

<img src="images/logo.png" class="logo">

<h1>ALAIN<br>MALAHIN</h1>

<div class="gold">
History inspires. Identity defines.
</div>

<div class="sub">
Enter the Universe
</div>

<a href="#">ENTER</a>

</div>

</section>

</body>
</html>
