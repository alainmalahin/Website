<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ALAIN MALAHIN</title>

  <meta name="description"
        content="History inspires. Identity defines.">

  <link rel="stylesheet" href="style.css?v=14">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">
</head>

<body>

  <audio id="ambient-audio" loop>
    <source src="audio/ambient.mp3"
            type="audio/mpeg">
  </audio>

  <div class="video-entry"
       id="video-entry">

    <video
      id="entrance-video"
      autoplay
      muted
      playsinline
      preload="auto">

      <source
        src="entrada-alain-malahin-final-web.mp4"
        type="video/mp4">

    </video>

    <header class="video-overlay"
            id="hero">

      <div class="language-switcher"
           aria-label="Language selector">

        <button
          type="button"
          class="language-btn active"
          data-lang="es">
          ES
        </button>

        <span>/</span>

        <button
          type="button"
          class="language-btn"
          data-lang="en">
          EN
        </button>

      </div>

      <button
        id="sound-toggle"
        class="sound-toggle"
        type="button">
        SOUND ON
      </button>

      <div class="hero-content">

        <h1 class="brand-slogan">

          <span data-es="LA HISTORIA INSPIRA"
                data-en="HISTORY INSPIRES">
            LA HISTORIA INSPIRA
          </span>

          <br>

          <span data-es="LA IDENTIDAD DEFINE"
                data-en="IDENTITY DEFINES">
            LA IDENTIDAD DEFINE
          </span>

        </h1>

        <nav class="main-menu">

          <a href="story.html">
            LA HISTORIA DE ALAIN MALAHIN
          </a>

          <a href="collections.html">
            DESCUBRE LA COLECCIÓN
          </a>

        </nav>

      </div>

    </header>

  </div>

  <script src="script.js?v=5"></script>

</body>

</html>
